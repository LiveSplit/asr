[package]
name = "harness"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
livesplit-auto-splitting = { git = "https://github.com/LiveSplit/livesplit-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = "0.3"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
members = ["splitter"]
